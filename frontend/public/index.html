<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#000000" />
        <meta name="description" content="QStudy Agent Portal" />
        <!--
        Content Security Policy: only this site's own scripts and styles run, nothing is framed except
        YouTube news videos, and the browser may only talk to this site and the API (REACT_APP_BACKEND_URL,
        filled in at build time). Fonts are bundled with the app, so no Google servers are contacted.
        If you move the API to another address, rebuild so this line follows it.
        -->
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: %REACT_APP_BACKEND_URL%; media-src 'self' blob: https: %REACT_APP_BACKEND_URL%; font-src 'self' data:; connect-src 'self' %REACT_APP_BACKEND_URL% ws://localhost:* http://localhost:*; frame-src https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'"
        />
        <meta name="referrer" content="no-referrer" />
        <title>QStudy | Agent Portal</title>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
    </body>
</html>
